{% extends "base.html" %}

{% block content %}
  <h1>Delete Newspaper</h1>
  <p>Are you sure you want to delete article: <strong>{{ newspaper.title }}</strong>?</p>
  <form action="" method="post">
    {% csrf_token %}
    <input type="submit" value="Yes, delete" class="btn btn-danger">
    <a href="{% url 'agency:newspaper-list' %}" class="btn btn-secondary">Cancel</a>
  </form>
{% endblock %}
